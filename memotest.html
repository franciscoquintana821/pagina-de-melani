<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Memotest Sustentable</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #fa891f, #3fd619);
      font-family: Lobster, cursive;
    }

    .juego {
      width: 90%;
      max-width: 500px;
      text-align: center;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    /* LOGO COCA-COLA */

    .logo {
      background: #dd1d2a;
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo img {
      width: 100%;
      max-width: 400px;
      height: auto;
      display: block;
      border-radius: 8px;
    }

    h1 {
      margin-top: 0;
      color: #333;
    }

    .subtitulo {
      color: #1b5e20;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .info {
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: bold;
      color: #555;
    }

    .tablero {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .carta {
      height: 90px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: #dd1d2a;
      color: white;
      font-size: 25px;
      font-weight: bold;
      transition: transform 0.3s, background 0.3s;
      transform-style: preserve-3d;

      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 5px;
    }

    .carta:hover {
      transform: scale(1.05);
    }

    /* LOGO EN EL REVERSO DE LAS CARTAS */

    .carta .logo-carta {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    /* Cuando se da vuelta aparece el elemento sustentable */

    .carta.volteada,
    .carta.encontrada {
      background: #f3f4f6;
      color: #ff7300;
      cursor: default;
      font-size: 40px;
    }

    .carta.encontrada {
      background: #86efac;
    }

    button.reiniciar {
      margin-top: 20px;
      padding: 12px 25px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button.reiniciar:hover {
      background: #16a34a;
    }

    .mensaje {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      background: #e8f5e9;
      color: #1b5e20;
      font-size: 14px;
    }

    @media (max-width: 400px) {

      .carta {
        height: 70px;
        font-size: 20px;
      }

      .carta.volteada,
      .carta.encontrada {
        font-size: 30px;
      }

    }

  </style>

</head>


<body>

  <div class="juego">

    <!-- LOGO COCA-COLA -->

    <div class="logo">

      <img src="cocacola.jpeg" alt="Coca-Cola">

    </div>


    <h1>🧠 Memotest</h1>

    <div class="subtitulo">
      🌱 Cuidemos el medio ambiente 🌎
    </div>


    <div class="info">

      <span>
        Intentos:
        <span id="movimientos">0</span>
      </span>

      <span>
        Parejas:
        <span id="parejas">0</span>/8
      </span>

    </div>


    <div class="tablero" id="tablero"></div>


    <button class="reiniciar" onclick="iniciarJuego()">
      🔄 Reiniciar
    </button>


    <div class="mensaje">
      ♻️ Cada pequeña acción cuenta para cuidar nuestro planeta.
    </div>

  </div>


  <script>

    /*
      ELEMENTOS DE SUSTENTABILIDAD
      Cada emoji aparece dos veces
      para formar las parejas.
    */

    const emojis = [

      "♻️", "♻️",
      "🌳", "🌳",
      "💧", "💧",
      "☀️", "☀️",
      "🚲", "🚲",
      "🌱", "🌱",
      "🔋", "🔋",
      "🌎", "🌎"

    ];


    let primeraCarta = null;
    let segundaCarta = null;
    let bloqueo = false;
    let movimientos = 0;
    let parejas = 0;


    const tablero =
      document.getElementById("tablero");


    const movimientosTexto =
      document.getElementById("movimientos");


    const parejasTexto =
      document.getElementById("parejas");


    function mezclar(array) {

      return array.sort(
        () => Math.random() - 0.5
      );

    }


    function iniciarJuego() {

      tablero.innerHTML = "";

      movimientos = 0;
      parejas = 0;

      primeraCarta = null;
      segundaCarta = null;

      bloqueo = false;


      movimientosTexto.textContent =
        movimientos;

      parejasTexto.textContent =
        parejas;


      const cartas =
        mezclar([...emojis]);


      cartas.forEach((emoji) => {

        const carta =
          document.createElement("button");


        carta.classList.add("carta");


        carta.dataset.valor =
          emoji;


        /*
          ANTES DE VOLTEAR:
          aparece el logo de Coca-Cola
        */

        const logoCarta =
          document.createElement("img");

        logoCarta.src = "cocacola.jpeg";

        logoCarta.alt = "Coca-Cola";

        logoCarta.classList.add("logo-carta");


        carta.appendChild(logoCarta);


        carta.addEventListener(
          "click",
          () => voltearCarta(carta)
        );


        tablero.appendChild(carta);

      });

    }


    function voltearCarta(carta) {

      if (

        bloqueo ||

        carta === primeraCarta ||

        carta.classList.contains("volteada") ||

        carta.classList.contains("encontrada")

      ) {

        return;

      }


      carta.classList.add("volteada");


      /*
        Eliminamos el logo
        y mostramos el elemento sustentable
      */

      carta.innerHTML = "";

      carta.textContent =
        carta.dataset.valor;


      if (!primeraCarta) {

        primeraCarta = carta;

        return;

      }


      segundaCarta = carta;


      movimientos++;


      movimientosTexto.textContent =
        movimientos;


      comprobarPareja();

    }


    function comprobarPareja() {

      const iguales =
        primeraCarta.dataset.valor ===
        segundaCarta.dataset.valor;


      if (iguales) {

        primeraCarta.classList.add(
          "encontrada"
        );

        segundaCarta.classList.add(
          "encontrada"
        );


        parejas++;


        parejasTexto.textContent =
          parejas;


        resetearTurno();


        if (parejas === 8) {

          setTimeout(() => {

            alert(
              `🌎🎉 ¡Ganaste!

Encontraste todas las parejas en ${movimientos} movimientos.

♻️ ¡Cuidar el medio ambiente es tarea de todos!`
            );

          }, 300);

        }

      }

      else {

        bloqueo = true;


        setTimeout(() => {

          primeraCarta.classList.remove(
            "volteada"
          );

          segundaCarta.classList.remove(
            "volteada"
          );


          /*
            Volvemos a mostrar el logo
          */

          primeraCarta.innerHTML = "";

          const logo1 =
            document.createElement("img");

          logo1.src = "cocacola.jpeg";
          logo1.alt = "Coca-Cola";
          logo1.classList.add("logo-carta");

          primeraCarta.appendChild(logo1);


          segundaCarta.innerHTML = "";

          const logo2 =
            document.createElement("img");

          logo2.src = "cocacola.jpeg";
          logo2.alt = "Coca-Cola";
          logo2.classList.add("logo-carta");

          segundaCarta.appendChild(logo2);


          resetearTurno();

        }, 900);

      }

    }


    function resetearTurno() {

      primeraCarta = null;
      segundaCarta = null;
      bloqueo = false;

    }


    iniciarJuego();

  </script>

</body>

</html>
